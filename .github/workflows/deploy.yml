name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Shared with deploy-staging.yml so a production build and a staging build never
  # overlap on the droplet (each build peaks ~2GB).
  group: droplet-build
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/vp-whiteboard

            # --- Latest code ---
            git fetch origin
            git checkout master
            git reset --hard origin/master

            # --- Laravel (repo root) ---
            # .env is gitignored and persists on disk (DB creds, APP_KEY, etc.).
            # Fail loudly rather than silently booting with no config.
            if [ ! -f .env ]; then echo "ERROR: /var/www/vp-whiteboard/.env missing"; exit 1; fi
            php /usr/local/bin/composer-phar install --no-dev --optimize-autoloader --no-interaction
            php artisan config:clear
            php artisan migrate --force
            php artisan storage:link 2>/dev/null || true   # recreate the public/storage symlink if missing

            # Seed production auth accounts if SEED_USERS_JSON is set (Spec 008)
            if [ -n "$SEED_USERS_JSON" ]; then
              php artisan db:seed --class=UserSeeder
            fi

            chown -R www-data:www-data storage bootstrap/cache
            chown www-data:www-data .env && chmod 640 .env   # FPM must read .env

            # --- Nuxt frontend (frontend/) ---
            cd frontend
            npm install --no-audit --no-fund
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            # --- PM2: re-create both processes with correct paths + env ---
            # (delete+start, not restart, so a drifted saved config never wins)
            cd /var/www/vp-whiteboard
            pm2 delete vp-whiteboard 2>/dev/null || true
            pm2 delete vp-ws-server 2>/dev/null || true

            PORT=3000 \
              NUXT_PUBLIC_LARAVEL_URL=https://whiteboard.vp-associates.com \
              NUXT_PUBLIC_SITE_URL=https://whiteboard.vp-associates.com \
              NUXT_PUBLIC_WS_URL=wss://whiteboard.vp-associates.com \
              APP_ENV=production \
              pm2 start .output/server/index.mjs \
                --name vp-whiteboard \
                --cwd /var/www/vp-whiteboard/frontend

            # SESSION_COOKIE must match Laravel's Str::slug(APP_NAME).'-session'
            # (APP_NAME=Laravel => "laravel-session").
            WS_PORT=3001 \
              LARAVEL_URL=https://whiteboard.vp-associates.com \
              SESSION_COOKIE=laravel-session \
              pm2 start server/ws-server.js \
                --name vp-ws-server \
                --cwd /var/www/vp-whiteboard/frontend

            pm2 save

            echo "Production deployment successful!"
