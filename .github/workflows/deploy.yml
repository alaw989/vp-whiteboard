name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          envs: SITE_URL,WS_URL,AUTH_PASSWORD,AUTH_SECRET,SUPABASE_URL,SUPABASE_ANON_KEY,NUXT_PUBLIC_SUPABASE_URL,NUXT_PUBLIC_SUPABASE_ANON_KEY
          script: |
            cd /var/www/vp-whiteboard

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Create .env file with production values
            cat > .env << EOF
            NUXT_PUBLIC_SITE_URL=$SITE_URL
            NUXT_PUBLIC_WS_URL=$WS_URL
            AUTH_PASSWORD=$AUTH_PASSWORD
            AUTH_SECRET=$AUTH_SECRET
            SUPABASE_URL=$SUPABASE_URL
            SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
            NUXT_PUBLIC_SUPABASE_URL=$NUXT_PUBLIC_SUPABASE_URL
            NUXT_PUBLIC_SUPABASE_ANON_KEY=$NUXT_PUBLIC_SUPABASE_ANON_KEY
            EOF

            # Install dependencies
            npm install

            # Build the application (with increased heap for small servers)
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            # Restart PM2 processes
            pm2 restart vp-whiteboard
            pm2 restart vp-ws-server

            # Save PM2 config
            pm2 save

            echo "Deployment successful!"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          WS_URL: ${{ secrets.WS_URL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
