name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: droplet-build
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/vp-whiteboard

            PREVIOUS=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
            echo "Previous commit: $PREVIOUS"

            git fetch origin
            git checkout master
            git reset --hard origin/master

            if [ ! -f .env ]; then echo "ERROR: .env missing"; exit 1; fi
            php /usr/local/bin/composer-phar install --no-dev --optimize-autoloader --no-interaction
            php artisan config:clear
            php artisan migrate --force
            php artisan storage:link 2>/dev/null || true
            chown -R www-data:www-data storage bootstrap/cache
            chown www-data:www-data .env && chmod 640 .env

            cd frontend
            npm install --no-audit --no-fund
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            cd /var/www/vp-whiteboard
            pm2 delete vp-whiteboard 2>/dev/null || true
            pm2 delete vp-ws-server 2>/dev/null || true

            PORT=3000 \
              NUXT_PUBLIC_LARAVEL_URL=https://whiteboard.vp-associates.com \
              NUXT_PUBLIC_SITE_URL=https://whiteboard.vp-associates.com \
              NUXT_PUBLIC_WS_URL=wss://whiteboard.vp-associates.com \
              pm2 start .output/server/index.mjs \
                --name vp-whiteboard \
                --cwd /var/www/vp-whiteboard/frontend

            WS_PORT=3001 \
              LARAVEL_URL=https://whiteboard.vp-associates.com \
              SESSION_COOKIE=laravel-session \
              pm2 start server/ws-server.js \
                --name vp-ws-server \
                --cwd /var/www/vp-whiteboard/frontend

            pm2 save

            echo "Deployment successful! (previous: $PREVIOUS)"
